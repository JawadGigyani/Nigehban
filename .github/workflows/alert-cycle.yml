# Runs one alert cycle every 3 hours (risk for all tehsils, fixed rules, alerts to subscribers).
# Repository secrets needed: NIGEHBAN_API_URL (e.g. https://<user>-nigehban.hf.space) and
# NIGEHBAN_INTERNAL_TOKEN (same value as the backend's NIGEHBAN_INTERNAL_TOKEN).
name: alert-cycle

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the backend
        run: curl -fsS --retry 5 --retry-delay 20 --max-time 120 "${{ secrets.NIGEHBAN_API_URL }}/health" || true
      - name: Run the alert cycle
        run: |
          curl -fsS --retry 3 --retry-delay 30 --max-time 600 \
            -X POST "${{ secrets.NIGEHBAN_API_URL }}/internal/run-cycle" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${{ secrets.NIGEHBAN_INTERNAL_TOKEN }}" \
            -d '{"deliver": true}'
