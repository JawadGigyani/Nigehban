[project]
name = "nigehban"
version = "0.1.0"
description = "Tehsil-level flash-flood early warning for northern Khyber Pakhtunkhwa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=43.0",
    "fastapi>=0.115",
    "geopandas>=1.0",
    "httpx>=0.27",
    "joblib>=1.4",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyarrow>=15.0",
    "pyogrio>=0.9",
    "pysheds>=0.4",
    "rasterio>=1.4",
    "scipy>=1.13",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "shapely>=2.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
# Only for comparing model types in pipelines/risk (the shipped model is scikit-learn).
train = [
    "lightgbm>=4.5",
    "xgboost>=2.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real external service (opt-in with NIGEHBAN_RUN_LIVE=1)",
]
